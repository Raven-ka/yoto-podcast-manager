<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Same mark on Apple's icon grid (824px tile, 100px margin) so it sits
       at the same visual size as other Dock icons. -->
  <defs>
    <filter id="s" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(8.24)" filter="url(#s)">
    <rect width="100" height="100" rx="22.5" fill="#D63B16"/>
    <rect x="27" y="17" width="34" height="56" rx="8" fill="#FFC93C" transform="rotate(6 44 45)"/>
    <g transform="rotate(-8 38 48)">
      <rect x="21" y="20" width="34" height="56" rx="8" fill="#fff"/>
      <polygon points="33,39 33,57 47,48" fill="#D63B16"/>
    </g>
    <path d="M66 38 a13 13 0 0 1 0 22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M75 30 a24 24 0 0 1 0 38" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".6"/>
  </g>
</svg>
