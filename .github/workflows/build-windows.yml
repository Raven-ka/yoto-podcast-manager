# Builds the Windows installer on GitHub's machines and attaches it to a
# DRAFT release (tag v<version from tauri.conf.json>). The macOS .dmg is built
# and notarized locally (see README) and uploaded to the same draft by hand;
# nothing is public until the draft is published.
#
# Run it from GitHub: Actions → "Build Windows" → Run workflow.
name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundle so installed copies accept auto-updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Podcast Manager for Yoto v__VERSION__
          releaseBody: See the assets below to download.
          releaseDraft: true
          prerelease: false
